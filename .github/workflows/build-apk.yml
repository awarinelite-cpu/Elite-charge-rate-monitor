name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Elite-Charge-Rate-Monitor.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Elite-Charge-Rate-Monitor-apk
          path: Elite-Charge-Rate-Monitor.apk

      # Direct-download link on the Releases page, so the APK can be fetched straight from the phone.
      - name: Publish to the "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          prerelease: true
          files: Elite-Charge-Rate-Monitor.apk
